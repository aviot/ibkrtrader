[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ibkrtrader"
version = "0.1.0"
description = "A desktop IBKR trading shell with numpad-first workflow."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.8"]
ibkr = ["ib_insync>=0.9.86"]
build = ["PyInstaller>=6.11"]

[project.scripts]
ibkr-shell = "ibkr_shell.main:main"

[tool.setuptools]
packages = ["ibkr_shell"]
