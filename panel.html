<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>交易纪律面板</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <main class="layout">
      <section class="card">
        <h1>今日重要新闻</h1>
        <p class="hint">输入一条新闻后可设置优先级（数值越小越靠前）。</p>
        <form id="news-form" class="news-form">
          <label>
            新闻内容
            <textarea id="news-text" rows="3" placeholder="例如：FOMC 会议纪要偏鹰派"></textarea>
          </label>
          <label>
            排序优先级
            <input id="news-rank" type="number" min="1" step="1" value="1" />
          </label>
          <button type="submit">添加新闻</button>
        </form>
        <ul id="news-list" class="news-list"></ul>
      </section>

      <section class="card">
        <h2>下单前 Checklist（必须全部满足）</h2>
        <form id="checklist-form" class="checklist">
          <label><input type="checkbox" name="hasNews" /> 有消息吗？</label>
          <label><input type="checkbox" name="aboveMA5" /> 在 5 日线上吗？</label>
          <label><input type="checkbox" name="isLeader" /> 是龙头吗？</label>
          <label><input type="checkbox" name="notFallingKnife" /> 不是飞刀吗？</label>
          <label><input type="checkbox" name="notOverextended" /> 没涨太多吗？</label>

          <label class="uncertain-row">
            <input type="checkbox" id="uncertain" /> 有“不确定”
          </label>
        </form>

        <div id="decision" class="decision pending">等待检查结果…</div>
        <p class="rule-note">👉 有一个“不确定”：<strong>❌ 直接不下单</strong></p>
        <p class="rule-note">👉 违反规则：<strong>今天立即停止交易</strong></p>
      </section>
    </main>

    <template id="news-item-template">
      <li class="news-item">
        <span class="news-rank"></span>
        <span class="news-text"></span>
        <button class="delete-btn" type="button" aria-label="删除新闻">删除</button>
      </li>
    </template>

    <script src="panel.js"></script>
  </body>
</html>
